AWSTemplateFormatVersion: '2010-09-09'
Description: S3 storage and IAM role for customer support flow evaluation

Resources:
  EvaluationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: CustomerSupportBedrockFlow

  EvaluationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bedrock-flow-evaluation-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:evaluation-job/*
      Policies:
        - PolicyName: EvaluateFlowResponses
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAndWriteEvaluationData
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub ${EvaluationBucket.Arn}/*
              - Sid: ListEvaluationBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:ListBucketVersions
                Resource: !GetAtt EvaluationBucket.Arn
              - Sid: InvokeJudge
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:CreateModelInvocationJob
                  - bedrock:StopModelInvocationJob
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*

Outputs:
  EvalDatasetBucketName:
    Value: !Ref EvaluationBucket
  BedrockEvalRoleArn:
    Value: !GetAtt EvaluationRole.Arn
